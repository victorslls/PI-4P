<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smartbus - Criar Administrador</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      padding: 20px;
    }
    .register-container {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      padding: 45px 55px;
      border-radius: 20px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      width: 100%;
      max-width: 480px;
      border: 1px solid #334155;
      position: relative;
      overflow: hidden;
    }
    .register-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 5px;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
    }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo svg {
      width: 90px; height: 90px;
      stroke: #06b6d4;
      filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.5));
    }
    .logo h1 {
      font-size: 32px; margin-top: 12px;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    h2 { text-align: center; margin-bottom: 15px; color: #cbd5e1; font-size: 22px; }
    .info {
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid #06b6d4;
      color: #06b6d4;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 25px;
    }
    .form-group { margin-bottom: 22px; }
    label {
      display: block; margin-bottom: 8px;
      font-size: 14px; color: #94a3b8; font-weight: 500;
    }
    input {
      width: 100%; padding: 15px 18px;
      border-radius: 12px; border: 1px solid #334155;
      background: #1e293b; color: #e2e8f0;
      font-size: 16px; transition: all 0.3s ease;
    }
    input:focus {
      outline: none; border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.25);
    }
    button {
      width: 100%; padding: 16px;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      color: white; border: none; border-radius: 12px;
      font-size: 17px; font-weight: 600; cursor: pointer;
      transition: all 0.3s ease; margin-top: 10px;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(139, 92, 246, 0.5); }
    .messages { margin-top: 15px; text-align: center; font-size: 15px; min-height: 24px; }
    .error { color: #fb7185; display: none; }
    .success { color: #34d399; display: none; }
    .login-link { text-align: center; margin-top: 25px; font-size: 15px; }
    .login-link a { color: #06b6d4; text-decoration: none; font-weight: 500; }
    .login-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8" cy="10" r="2"/>
        <path d="M21 14h-3.5"/>
        <path d="M21 10h-3.5"/>
        <path d="M12 15v6"/>
      </svg>
      <h1>Smartbus</h1>
    </div>

    <h2>Criar Administrador</h2>
    <div class="info" id="info-text">
      Ainda podem ser criados <strong>3</strong> administradores.
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label>Chave de Instalação</label>
        <input type="password" id="chave" placeholder="Chave secreta do sistema" required />
      </div>
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" id="nome" placeholder="Ex: Ana Costa" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="ana@smartbus.com" required />
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 8 caracteres" minlength="8" required />
      </div>
      <div class="form-group">
        <label>Confirmar senha</label>
        <input type="password" id="confirma" required />
      </div>

      <div class="messages">
        <p class="error" id="error"></p>
        <p class="success" id="success">Administrador criado com sucesso!</p>
      </div>

      <button type="submit">Criar Novo Administrador</button>
    </form>

    <div class="login-link">
      Já tem conta? <a href="login.html">Fazer login</a>
    </div>
  </div>

  <script>
    // MUDE ESTA CHAVE PARA ALGO MUITO FORTE E SÓ VOCÊ SABE!
    const CHAVE_INSTALACAO = "Smartbus#2025@SetupUltraSecreto!";

    const MAX_ADMINS = 3;

    // Carrega lista de admins já criados (se não existir, cria vazia)
    let admins = JSON.parse(localStorage.getItem("smartbus_admins") || "[]");

    // Se já tiver 3 admins → bloqueia permanentemente
    if (admins.length >= MAX_ADMINS) {
      document.body.innerHTML = `
        <div style="text-align:center;padding:60px;color:white;font-family:Poppins,sans-serif;">
          <h2>Limite Atingido</h2>
          <p>Já foram criados <strong>3 administradores</strong>.<br>
          Não é mais possível criar novas contas.</p>
          <br>
          <a href="login.html" style="color:#06b6d4;font-size:18px;text-decoration:underline;">Ir para login</a>
        </div>`;
      throw new Error("Limite de administradores atingido");
    }

    // Atualiza contador na tela
    const restantes = MAX_ADMINS - admins.length;
    document.getElementById("info-text").innerHTML = 
      `Podem ser criados mais <strong>${restantes}</strong> administrador${restantes > 1 ? 'es' : ''}.`;

    const form = document.getElementById("registerForm");
    const errorMsg = document.getElementById("error");
    const successMsg = document.getElementById("success");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const chave = document.getElementById("chave").value;
      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const senha = document.getElementById("senha").value;
      const confirma = document.getElementById("confirma").value;

      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      // Validação da chave secreta
      if (chave !== CHAVE_INSTALACAO) {
        showError("Chave de instalação incorreta!");
        return;
      }

      if (!nome || !email || !senha) {
        showError("Preencha todos os campos.");
        return;
      }
      if (senha.length < 8) {
        showError("A senha deve ter no mínimo 8 caracteres.");
        return;
      }
      if (senha !== confirma) {
        showError("As senhas não coincidem.");
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError("Email inválido.");
        return;
      }

      // Verifica se email já existe
      if (admins.some(a => a.email === email)) {
        showError("Este email já está cadastrado!");
        return;
      }

      // Adiciona novo admin na lista
      admins.push({ nome, email, senha });
      localStorage.setItem("smartbus_admins", JSON.stringify(admins));

      // Loga automaticamente o novo admin
      localStorage.setItem("adminLogado", "true");
      localStorage.setItem("adminEmail", email);
      localStorage.setItem("adminNome", nome);

      successMsg.style.display = "block";

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1800);
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
    }
  </script>
</body>
</html>
