<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smartbus - Login</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }
    .login-container {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px 50px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 420px;
      border: 1px solid #334155;
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo img {
      width: 80px;
    }
    .logo h1 {
      font-size: 28px;
      margin-top: 10px;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 16px;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4);
    }
    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
    .register-link a {
      color: #06b6d4;
      text-decoration: none;
    }
    .error {
      color: #ef4444;
      font-size: 14px;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8" cy="10" r="2"/>
        <path d="M21 14h-3.5"/>
        <path d="M21 10h-3.5"/>
      </svg>
      <h1>Smartbus</h1>
    </div>
    <h2>Bem-vindo de volta</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="admin@smartbus.com"/>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="password" required placeholder="••••••••"/>
      </div>
      <p id="error" class="error">Email ou senha incorretos!</p>
      <button type="submit">Entrar no Dashboard</button>
    </form>
    <div class="register-link">
      Não tem conta de administrador? <a href="registe.html">Criar conta admin</a>
    </div>
  </div>

  <script>
    // Admin padrão (para teste)
    const adminCredenciais = {
      email: "admin@smartbus.com",
      senha: "smartbus2025"
    };

    // Verifica se já está logado
    if (localStorage.getItem("adminLogado") === "true") {
      window.location.href = "dashboard.html";
    }

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const email = document.getElementById("email").value;
      const senha = document.getElementById("password").value;
      const error = document.getElementById("error");

      // Validação simples (pode conectar com backend depois)
      if (email === adminCredenciais.email && senha === adminCredenciais.senha ||
          localStorage.getItem("adminEmail") === email && localStorage.getItem("adminSenha") === senha) {
        localStorage.setItem("adminLogado", "true");
        localStorage.setItem("adminEmail", email);
        window.location.href = "dashboard.html";
      } else {
        error.style.display = "block";
      }
    });
  </script>
</body>
</html>
